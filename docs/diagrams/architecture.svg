    .box { fill: #1b2533; stroke: #41536b; stroke-width: 2; rx: 12; }
    .gate { fill: #183c38; stroke: #66dfbd; stroke-width: 2; rx: 12; }
    .line { fill: none; stroke: #91a5bf; stroke-width: 2; marker-end: url(#arrow); }
    .allow { fill: none; stroke: #66dfbd; stroke-width: 2; marker-end: url(#green); }
    .note { font-size: 18px; fill: #b8c8dd; }
    .approved { font-size: 18px; fill: #66dfbd; }
  </style>
